general {
    col.active_border = rgba(9f8d83AA)
    col.inactive_border = rgba(52443bAA)
}

misc {
    background_color = rgba(19120dFF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(19120dFF)
        col.text = rgba(f0dfd6FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(f0dfd6), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(f0dfd6), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(f0dfd6), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(ffb784AA) rgba(ffb78477),pinned:1
